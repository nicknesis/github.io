<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop Empire</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #160c06;
      color: #f0e0cc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #2b1508;
      border-bottom: 2px solid #8b5a2b;
      padding: 12px 24px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.5rem;
      color: #d4914e;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 10px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9a7050;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f0e0cc;
      line-height: 1.2;
    }

    #money-display { color: #4ade80; font-size: 2rem; }

    /* ── Main layout ── */
    .game-area {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Click zone ── */
    .click-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1c0d05;
      gap: 16px;
    }

    .cup-wrap {
      position: relative;
    }

    #coffee-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 110px;
      line-height: 1;
      display: block;
      filter: drop-shadow(0 0 18px rgba(212, 145, 78, 0.45));
      transition: transform 0.08s ease, filter 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    #coffee-btn:hover {
      filter: drop-shadow(0 0 28px rgba(212, 145, 78, 0.75));
      transform: scale(1.06);
    }

    #coffee-btn:active {
      transform: scale(0.93);
      filter: drop-shadow(0 0 10px rgba(212, 145, 78, 0.3));
    }

    .click-hint {
      font-size: 0.85rem;
      color: #7a5035;
    }

    /* Floating "+$X" text */
    .float-text {
      position: fixed;
      font-size: 1.3rem;
      font-weight: 700;
      color: #4ade80;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 999;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    @keyframes floatUp {
      0%   { opacity: 1;   transform: translateY(0) scale(1); }
      20%  { opacity: 1;   transform: translateY(-12px) scale(1.1); }
      100% { opacity: 0;   transform: translateY(-70px) scale(0.9); }
    }

    /* ── Upgrades panel ── */
    .upgrades-panel {
      width: 320px;
      background: #221008;
      border-left: 2px solid #3d1f0a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .upgrades-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #3d1f0a;
      flex-shrink: 0;
    }

    .upgrades-header h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4914e;
    }

    .upgrades-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a2010 #221008;
    }

    .upgrades-list::-webkit-scrollbar { width: 6px; }
    .upgrades-list::-webkit-scrollbar-track { background: #221008; }
    .upgrades-list::-webkit-scrollbar-thumb { background: #4a2010; border-radius: 3px; }

    .upgrade-btn {
      width: 100%;
      background: #321508;
      border: 1px solid #4a2010;
      border-radius: 8px;
      padding: 11px 13px;
      margin-bottom: 9px;
      cursor: pointer;
      color: #f0e0cc;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }

    .upgrade-btn.affordable {
      border-color: #8b5a2b;
    }

    .upgrade-btn.affordable:hover {
      background: #3e1c0c;
      border-color: #d4914e;
    }

    .upgrade-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .ug-row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }

    .ug-name {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .ug-cost {
      font-weight: 700;
      font-size: 0.88rem;
    }

    .ug-cost.green { color: #4ade80; }
    .ug-cost.red   { color: #f87171; }

    .ug-desc {
      font-size: 0.78rem;
      color: #9a7050;
      margin-bottom: 2px;
    }

    .ug-owned {
      font-size: 0.72rem;
      color: #d4914e;
    }

    /* ── Footer save note ── */
    #save-note {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 0.7rem;
      color: #5a3520;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <h1>☕ Coffee Shop Empire</h1>
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label">Money</div>
      <div class="stat-value" id="money-display">$0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Per Second</div>
      <div class="stat-value" id="income-display">$0/s</div>
    </div>
    <div class="stat">
      <div class="stat-label">Per Click</div>
      <div class="stat-value" id="click-display">$1</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Earned</div>
      <div class="stat-value" id="total-display">$0</div>
    </div>
  </div>
</header>

<div class="game-area">

  <div class="click-zone">
    <div class="cup-wrap">
      <button id="coffee-btn" aria-label="Click coffee cup to earn money">☕</button>
    </div>
    <div class="click-hint">Tap the cup to earn money!</div>
  </div>

  <div class="upgrades-panel">
    <div class="upgrades-header">
      <h2>Upgrades</h2>
    </div>
    <div class="upgrades-list" id="upgrades-list"></div>
  </div>

</div>

<div id="save-note">Auto-saved</div>

<script>
  // ── Upgrade definitions ──────────────────────────────────────────────────
  const UPGRADES = [
    {
      id: 'barista',
      name: 'Barista',
      cost: 50,
      desc: 'Generates $1 per second',
      passivePerOwned: 1,
      clickBonusPerOwned: 0,
    },
    {
      id: 'register',
      name: 'Second Register',
      cost: 200,
      desc: 'Doubles your click earnings (+$1/click)',
      passivePerOwned: 0,
      clickBonusPerOwned: 1,
    },
    {
      id: 'driveThru',
      name: 'Drive-Thru Window',
      cost: 500,
      desc: 'Generates $5 per second',
      passivePerOwned: 5,
      clickBonusPerOwned: 0,
    },
    {
      id: 'newLocation',
      name: 'New Location',
      cost: 2000,
      desc: 'Generates $20 per second',
      passivePerOwned: 20,
      clickBonusPerOwned: 0,
    },
    {
      id: 'marketing',
      name: 'Marketing Campaign',
      cost: 5000,
      desc: 'Makes clicks worth $5 each (+$4/click)',
      passivePerOwned: 0,
      clickBonusPerOwned: 4,
    },
  ];

  // ── State ────────────────────────────────────────────────────────────────
  let money = 0;
  let totalEarned = 0;
  const owned = {};
  UPGRADES.forEach(u => { owned[u.id] = 0; });

  // ── Derived values ───────────────────────────────────────────────────────
  function clickValue() {
    let v = 1;
    UPGRADES.forEach(u => { v += u.clickBonusPerOwned * owned[u.id]; });
    return v;
  }

  function passiveIncome() {
    let v = 0;
    UPGRADES.forEach(u => { v += u.passivePerOwned * owned[u.id]; });
    return v;
  }

  // ── Formatting ───────────────────────────────────────────────────────────
  function fmt(n) {
    n = Math.floor(n);
    if (n >= 1_000_000_000) return '$' + (n / 1_000_000_000).toFixed(2) + 'B';
    if (n >= 1_000_000)     return '$' + (n / 1_000_000).toFixed(2) + 'M';
    if (n >= 10_000)        return '$' + (n / 1_000).toFixed(1) + 'K';
    return '$' + n.toLocaleString();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render() {
    document.getElementById('money-display').textContent = fmt(money);
    document.getElementById('income-display').textContent = fmt(passiveIncome()) + '/s';
    document.getElementById('click-display').textContent = fmt(clickValue());
    document.getElementById('total-display').textContent = fmt(totalEarned);
    renderUpgrades();
  }

  function renderUpgrades() {
    const list = document.getElementById('upgrades-list');
    UPGRADES.forEach(u => {
      const canAfford = money >= u.cost;
      let btn = document.getElementById('btn-' + u.id);

      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'btn-' + u.id;
        btn.className = 'upgrade-btn';
        btn.addEventListener('click', () => purchase(u.id));
        list.appendChild(btn);
      }

      btn.disabled = !canAfford;
      btn.className = 'upgrade-btn' + (canAfford ? ' affordable' : '');

      const ownedCount = owned[u.id];
      btn.innerHTML = `
        <div class="ug-row1">
          <span class="ug-name">${u.name}</span>
          <span class="ug-cost ${canAfford ? 'green' : 'red'}">${fmt(u.cost)}</span>
        </div>
        <div class="ug-desc">${u.desc}</div>
        ${ownedCount > 0 ? `<div class="ug-owned">Owned: ${ownedCount}</div>` : ''}
      `;
    });
  }

  // ── Purchase ─────────────────────────────────────────────────────────────
  function purchase(id) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u || money < u.cost) return;
    money -= u.cost;
    owned[id]++;
    render();
    saveGame();
  }

  // ── Click handler ────────────────────────────────────────────────────────
  document.getElementById('coffee-btn').addEventListener('click', e => {
    const earned = clickValue();
    money += earned;
    totalEarned += earned;
    render();

    // Floating "+$X" animation with slight scatter so stacked clicks don't overlap
    const el = document.createElement('span');
    el.className = 'float-text';
    el.textContent = '+' + fmt(earned);
    const scatter = () => Math.round((Math.random() - 0.5) * 40);
    el.style.left = (e.clientX + scatter()) + 'px';
    el.style.top  = (e.clientY - 10) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  });

  // ── Passive income tick ──────────────────────────────────────────────────
  setInterval(() => {
    const inc = passiveIncome();
    if (inc > 0) {
      money += inc;
      totalEarned += inc;
      render();
    }
  }, 1000);

  // ── Persistence ──────────────────────────────────────────────────────────
  const SAVE_KEY = 'coffeeShopEmpire_v1';

  function saveGame() {
    const data = { money, totalEarned, owned: { ...owned } };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    const note = document.getElementById('save-note');
    note.textContent = '✓ Saved';
    setTimeout(() => { note.textContent = 'Auto-saved'; }, 1500);
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      money = data.money || 0;
      totalEarned = data.totalEarned || 0;
      UPGRADES.forEach(u => {
        owned[u.id] = data.owned?.[u.id] ?? 0;
      });
    } catch (e) {
      console.warn('Save data corrupted, starting fresh.', e);
    }
  }

  // Auto-save every 20 seconds + on tab hide
  setInterval(saveGame, 20_000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveGame();
  });

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadGame();
  render();
</script>

</body>
</html>

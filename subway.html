<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nick's Subway Times</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #ff9900;
      font-family: 'Courier New', ui-monospace, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 4px;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      letter-spacing: 1px;
    }

    .station-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      color: #ccc;
      font-size: clamp(0.85rem, 3vw, 1.05rem);
    }

    .bullet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2850ad;
      color: #fff;
      font-weight: 700;
      font-family: Arial, sans-serif;
      flex-shrink: 0;
    }

    .board {
      width: 100%;
      max-width: 460px;
      margin-top: 28px;
      border: 2px solid #663f00;
      border-radius: 6px;
      background: #0a0500;
      padding: 10px 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #331f00;
    }

    .row:last-child { border-bottom: none; }

    .row .bullet.small {
      width: 34px;
      height: 34px;
      font-size: 1.05rem;
    }

    .row .dest {
      flex: 1;
      margin-left: 14px;
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #ffb84d;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .mins {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 700;
      color: #ff9900;
      text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);
      min-width: 70px;
      text-align: right;
    }

    .row .mins .unit {
      font-size: 0.5em;
      margin-left: 4px;
      color: #cc7a00;
    }

    .status {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #7a5a2a;
      text-align: center;
      min-height: 1.2em;
    }

    .empty, .error {
      padding: 30px 20px;
      text-align: center;
      color: #a06a2a;
      font-size: 0.95rem;
    }

    .error { color: #ff5c5c; }

    #refresh-btn {
      margin-top: 16px;
      background: #1a1000;
      border: 1px solid #663f00;
      color: #ff9900;
      font-family: inherit;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #refresh-btn:active { transform: scale(0.97); }

    pre#debug {
      max-width: 90vw;
      margin-top: 20px;
      color: #888;
      font-size: 0.65rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<header>
  <h1>Nick's Subway Times</h1>
  <div class="station-line">
    <span class="bullet">C</span>
    <span>Clinton–Washington Aves &rarr; Manhattan</span>
  </div>
</header>

<div class="board" id="board">
  <div class="empty" id="board-msg">Loading…</div>
</div>

<div class="status" id="status"></div>
<button id="refresh-btn">Refresh now</button>
<pre id="debug"></pre>

<script>
  // times.json is generated by .github/workflows/update-subway-times.yml,
  // which polls the train-times API server-side (no CORS restriction there)
  // and commits the result. The page just reads that same-origin file.
  const REFRESH_MS = 30_000;
  const DEBUG = new URLSearchParams(location.search).has('debug');

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const debugEl = document.getElementById('debug');

  const STALE_AFTER_MS = 10 * 60 * 1000;

  function minutesFromNow(isoTime) {
    const diffMs = new Date(isoTime).getTime() - Date.now();
    return Math.round(diffMs / 60000);
  }

  async function loadTimes() {
    try {
      // Cache-bust so the browser/CDN always hands us the freshest commit.
      const res = await fetch(`./times.json?_=${Date.now()}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();

      if (DEBUG) debugEl.textContent = JSON.stringify(json, null, 2);

      // Trains that already passed (data hasn't refreshed yet) shouldn't
      // linger on screen showing "now" forever, so drop anything more than
      // a few seconds old instead of clamping it to 0.
      const arrivals = (json.arrivals || [])
        .map(minutesFromNow)
        .filter(mins => mins >= 0)
        .sort((a, b) => a - b);
      render(arrivals);

      const updatedAgoMs = json.updated ? Date.now() - new Date(json.updated).getTime() : null;
      const stale = updatedAgoMs !== null && updatedAgoMs > STALE_AFTER_MS;
      statusEl.textContent = stale
        ? `Data last checked ${Math.round(updatedAgoMs / 60000)} min ago, may be behind`
        : 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      console.error(err);
      boardEl.innerHTML = `<div class="error">Couldn't load train times.<br>${err.message}</div>`;
      statusEl.textContent = 'Retrying at next refresh…';
    }
  }

  function render(arrivals) {
    if (!arrivals.length) {
      boardEl.innerHTML = `<div class="empty">No C trains toward Manhattan right now</div>`;
      return;
    }

    boardEl.innerHTML = arrivals.slice(0, 4).map(mins => `
      <div class="row">
        <span class="bullet small">C</span>
        <span class="dest">to Manhattan</span>
        <span class="mins">${mins === 0 ? 'now' : mins + '<span class="unit">min</span>'}</span>
      </div>
    `).join('');
  }

  document.getElementById('refresh-btn').addEventListener('click', loadTimes);

  loadTimes();
  setInterval(loadTimes, REFRESH_MS);
</script>

</body>
</html>
